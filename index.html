<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Beaver Remote</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: #fff; padding: 10px; margin: 0; }
        h1 { color: #f39c12; margin-top: 20px; font-size: 24px; }
        .control-box { background: #2a2a2a; border-radius: 12px; padding: 20px; margin: 15px auto; max-width: 400px; border: 2px solid #444; }
        .lever-header { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 15px; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .btn-on { background: #27ae60; }
        .btn-off { background: #c0392b; }
    </style>
</head>
<body>

    <h1>Colony Control Center</h1>

    <div class="control-box">
        <div class="lever-header">Floodgates Control</div>
        <div class="btn-group">
            <button class="btn btn-on" onclick="sendAction('switch-on', 'Floodgates')">Turn ON</button>
            <button class="btn btn-off" onclick="sendAction('switch-off', 'Floodgates')">Turn OFF</button>
        </div>
    </div>

    <script>
        // Your custom static link
        const gameUrl = "https://ngrok-free.dev"; 

        function sendAction(action, leverName) {
            // An Image Ping forces the iPad browser to send the signal through the GitHub firewall
            const ping = new Image();
            ping.src = `${gameUrl}/api/${action}/${leverName}?nocache=${Date.now()}`;
        }
    </script>
</body>
</html>
